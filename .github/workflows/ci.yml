
name: HRMS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend - Django Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hrms_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: hrms_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check database migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to CI database
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: python manage.py test

  frontend-ci:
    name: Frontend - React Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React frontend
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          tags: hrms-backend:ci

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: false
          tags: hrms-frontend:ci

  publish-images:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: true
          tags: |
            ghcr.io/droanpatel/hrms-backend:latest
            ghcr.io/droanpatel/hrms-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: true
          tags: |
            ghcr.io/droanpatel/hrms-frontend:latest
            ghcr.io/droanpatel/hrms-frontend:${{ github.sha }}


  deploy-local:
    name: Deploy HRMS to Windows Docker Desktop
    runs-on: [self-hosted, Windows, X64]

    needs:
      - publish-images

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Desktop
        run: |
          docker info --format '{{.OSType}}'
          docker compose version

      - name: Verify local environment file
        run: |
          $envPath = "C:\Users\Admin\OneDrive\Documents\HRMS_System\.env"
          if (-not (Test-Path $envPath)) {
            throw "Local .env file not found."
          }

      - name: Login to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy HRMS containers
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $envPath = "C:\Users\Admin\OneDrive\Documents\HRMS_System\.env"

          docker compose `
            --project-name hrms_system `
            --env-file "$envPath" `
            -f docker-compose.deploy.yml `
            pull

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed."
          }

          docker compose `
            --project-name hrms_system `
            --env-file "$envPath" `
            -f docker-compose.deploy.yml `
            up -d --no-build

          if ($LASTEXITCODE -ne 0) {
            throw "Docker deployment failed."
          }

      - name: Verify deployed containers
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $envPath = "C:\Users\Admin\OneDrive\Documents\HRMS_System\.env"

          docker compose `
            --project-name hrms_system `
            --env-file "$envPath" `
            -f docker-compose.deploy.yml `
            ps

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io

