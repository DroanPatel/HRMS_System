services:
  db:
    image: postgres:18
    container_name: hrms-db
    environment:
      POSTGRES_DB: hrms_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hrms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hrms-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: hrms-backend
    environment:
      DJANGO_DEBUG: "True"
      POSTGRES_DB: hrms_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrms-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: hrms-frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - hrms-network

# Persistent database storage
volumes:
  postgres_data_18:

# Private network for the services
networks:
  hrms-network:
